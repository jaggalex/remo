server {
    listen 8080;
    root /srv/app;
    index index.html;
    server_tokens off;
    client_max_body_size 4m;

    location = /healthz { return 200 "ok\n"; }
    location = /api/metrics { return 404; }
    location /api/ {
        proxy_pass http://sync:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Caddy is the edge proxy; pass its client address and scheme through. Do not
        # append `$remote_addr` here: that is the Caddy container, and the rate limiter
        # reads the rightmost entry.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }
    location /sync/ {
        proxy_pass http://sync:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The socket's Origin check derives the request origin from the scheme too.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /guide/ { return 302 https://docs.example.com$request_uri; }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 8081;
    server_tokens off;
    # TLS terminates at Caddy; redirects must retain the browser's external origin.
    absolute_redirect off;
    location = / { return 302 /guide/; }
    # Guide links deliberately keep /guide/: no second documentation build pipeline.
    location /guide/ {
        alias /srv/docs/;
        index index.html;
    }
    location /help/ { return 302 https://boards.example.com$request_uri; }
    location / { return 404; }
}
