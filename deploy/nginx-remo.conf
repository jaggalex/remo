# remo behind nginx: static app, API and WebSocket on one origin.
#
# Replace boards.example.com, then `nginx -t` and reload. certbot rewrites the TLS
# lines for you; the file below assumes certificates already exist.

server {
    listen 80;
    listen [::]:80;
    server_name boards.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boards.example.com;

    ssl_certificate     /etc/letsencrypt/live/boards.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boards.example.com/privkey.pem;

    root /srv/remo/apps/web/dist;
    index index.html;

    # Board metadata is small; the document itself travels over the socket.
    client_max_body_size 4m;
    server_tokens off;

    # Metrics are for the machine, not the internet.
    location = /api/metrics {
        return 404;
    }

    # Accounts, organisations, sharing. The trailing slash in proxy_pass strips /api.
    location /api/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live document: /sync/<room>. The service takes the room from the stripped path.
    location /sync/ {
        proxy_pass http://127.0.0.1:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The product guide is a static site built by `pnpm guide:build` (ADR-099).
    # No runtime and no container: the same nginx serves the files.
    location /guide/ {
        alias /srv/remo/docs-site/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Vite emits content-hashed file names; they can be cached forever.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The SPA shell must be revalidated, or a deploy leaves old tabs on old bundles.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

}
