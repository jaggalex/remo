# agents.<domain>: the address for external agents and integrations (ADR-251 §8).
#
# Same sync process as boards.<domain>, but a narrower surface and its own limits: the
# agent and integration API only. No app static files, no /guide/, no /sync/ sockets and
# no human-only routes. A bearer token keeps working on the main domain for compatibility;
# this is the address documentation recommends.
#
# This file is included from the http context (/etc/nginx/conf.d/), so the zones and the
# map below are global. Replace agents.example.com, `nginx -t`, reload.

# An empty Authorization header cannot key a token zone; fall back to the client address.
map $http_authorization $remo_agent_key {
    default $http_authorization;
    ""      $binary_remote_addr;
}

# Two independent limits: one client address cannot flood the service, and one token
# cannot be shared by a fleet of clients. nginx hashes the key in its shared tree; the
# Authorization value itself never appears in an access log.
limit_req_zone  $binary_remote_addr  zone=agents_ip_req:10m    rate=20r/s;
limit_req_zone  $remo_agent_key      zone=agents_token_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr  zone=agents_ip_conn:10m;
limit_conn_zone $remo_agent_key      zone=agents_token_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name agents.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agents.example.com;

    ssl_certificate     /etc/letsencrypt/live/agents.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.example.com/privkey.pem;

    server_tokens off;
    include /srv/remo/deploy/nginx-security-headers.conf;

    # The same ceiling as the API on the main domain.
    client_max_body_size 4m;

    limit_req  zone=agents_ip_req    burst=40 nodelay;
    limit_req  zone=agents_token_req burst=20 nodelay;
    limit_conn agents_ip_conn 32;
    limit_conn agents_token_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    # Agent tokens (/agent/...), integration tokens, and the resources both reach:
    # boards, organisations (agents, skills, integration tokens), search and images.
    location ~ ^/(agent|agents|agent-tasks|agent-schedules|agent-threads|change-sets|skills|boards|orgs|search|files)(/|$) {
        proxy_pass http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else on this hostname is not part of the agent surface.
    location / {
        return 404;
    }
}
