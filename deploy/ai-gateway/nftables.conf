#!/usr/sbin/nft -f
#
# VPS 2, the AI gateway host (ADR-251 §6.2). Nothing here is a default: the input and
# output policies are drop, and every accepted flow is one the gateway needs.
#
# Before loading, replace the defines below:
#   WAN            the public interface (`ip route show default` names it)
#   VPS1_PUBLIC    the public address of the remo host
#   ssh_admin      the addresses you administer this host from
#   dns_servers    the resolvers in /etc/resolv.conf
#
# Load with `nft -c -f nftables.conf`, then `nft -f nftables.conf` and
# `systemctl enable --now nftables` after copying it to /etc/nftables.conf.
#
# `destroy table` replaces only this table. Never `flush ruleset`: Docker keeps its own
# rules in the same backend and flushing them breaks every container on the host.
#
# The rules are IPv4. Because this is an `inet` table with a drop policy, IPv6 is closed
# as well: administer the host over IPv4, or add ip6 rules deliberately.

define WAN = "eth0"
define SSH_PORT = 22
define WG_PORT = 51820
define GATEWAY_PORT = 8080
define VPS1_PUBLIC = 203.0.113.10
define VPS1_WG = 10.77.0.1

destroy table inet remo_gw

table inet remo_gw {
  # SSH is key-only by sshd; this set is the address half of the allowlist.
  set ssh_admin {
    type ipv4_addr
    flags interval
    elements = { 198.51.100.10/32, 198.51.100.11/32 }
  }

  set dns_servers {
    type ipv4_addr
    elements = { 1.1.1.1, 9.9.9.9 }
  }

  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    iifname "lo" accept

    # PMTU and diagnostics, not a service. Without them large TLS responses can stall.
    icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept

    iifname $WAN ip saddr @ssh_admin tcp dport $SSH_PORT accept

    # The tunnel itself, from one address only.
    iifname $WAN ip saddr $VPS1_PUBLIC udp dport $WG_PORT accept

    # On the tunnel: the sync service, and nothing else. /healthz and /metrics share
    # this port; /metrics still needs its bearer token.
    iifname "wg0" ip saddr $VPS1_WG tcp dport $GATEWAY_PORT accept

    # The admin API on 127.0.0.1:8081 has no rule anywhere: only loopback reaches it.
  }

  chain output {
    type filter hook output priority filter; policy drop;

    ct state established,related accept
    oifname "lo" accept

    icmp type { destination-unreachable, time-exceeded, parameter-problem } accept

    # Provider calls and certificate/mirror fetches.
    tcp dport 443 accept

    # DNS only to the resolvers named above. systemd-resolved on 127.0.0.53 is covered
    # by the loopback rule; it forwards from here.
    ip daddr @dns_servers udp dport 53 accept
    ip daddr @dns_servers tcp dport 53 accept

    # The clock must stay right: TLS and the daily counters depend on it. If timesyncd or
    # chrony uses an external server, allow UDP 123 here on purpose, or let the host sync
    # before this ruleset is loaded.

    # WireGuard replies to the remo host. VPS 1 uses a fixed source port, so this rule
    # covers both the handshake answer and keepalives.
    ip daddr $VPS1_PUBLIC udp dport $WG_PORT accept
  }
}
