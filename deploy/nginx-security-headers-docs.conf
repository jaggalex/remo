# Security headers for the product guide (ADR-172).
#
# The guide is static and has no session, but it is same-site with the app, so it gets
# the same framing and sniffing rules. Its one inline script (the theme switch written by
# `scripts/guide-build.mjs`) is allowed by hash; `scripts/security-headers.test.mjs`
# recomputes the hash from the generator, so changing that script without this file
# fails the gate instead of silently breaking the theme.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-zc/g2wghKfTxvFA8T1WFo1nCE/EU70sfeLBgyHe8N4U='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
