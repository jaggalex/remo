# Security headers for the remo app origin (ADR-172).
#
# One file, included by every server and location that serves the app, because nginx
# drops the server's `add_header` lines in any location that declares its own (the
# `Cache-Control` locations below would otherwise ship without a policy).
# `scripts/security-headers.test.mjs` keeps this file, the docs file and the configs
# that include them in step.
#
# Content-Security-Policy, directive by directive:
#   script-src 'self'         the bundle and /theme-boot.js; no inline script, no eval
#   style-src 'unsafe-inline' React writes `style` attributes for canvas overlays
#   img-src data: blob:       export previews and the logo
#   connect-src wss://$host   the live document socket on this origin; add the origin of
#                             VITE_SYNC_URL here if the socket lives elsewhere
#   frame-ancestors 'none'    no clickjacking: the room is never framed
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# One year, this host only. `includeSubDomains`/`preload` are the operator's decision:
# they bind every sibling subdomain of the domain to HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Room ids live in the address; they never leave for another site in a Referer.
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
