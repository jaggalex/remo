# Security headers for an installation that shows the support widget (ADR-250).
#
# This is a template, not a file to include as it stands: `__SUPPORT_ORIGIN__` is not a
# valid CSP source. `render_support_headers` in `deploy/config.sh` substitutes the one
# operator origin and writes the result, because nginx `add_header` cannot read a variable:
#
#   . deploy/config.sh
#   render_support_headers https://support.example.com \
#     /srv/remo/shared/nginx-security-headers.conf
#
# Point every app location's include at that rendered file instead of
# `nginx-security-headers.conf`. The difference from the base file is exactly one
# directive: `frame-src <origin>`. With `REMO_SUPPORT_PROVIDER=none` or `link` the base
# file stays, and the app frames nothing.
#
# The widget page itself lives on that origin (the operator's agent repository). Its
# Content-Security-Policy must allow embedding and only from the app:
#
#   Content-Security-Policy: frame-ancestors https://boards.example.com
#
# and it must NOT send `X-Frame-Options: DENY`. The app sends `frame-ancestors 'none'`
# for itself in both variants, so a support page can never frame remo.
#
# Content-Security-Policy, directive by directive (only frame-src differs from the base):
#   script-src 'self'         the bundle and /theme-boot.js; no inline script, no eval
#   style-src 'unsafe-inline' React writes `style` attributes for canvas overlays
#   img-src data: blob:       export previews and the logo
#   connect-src wss://$host   the live document socket on this origin; add the origin of
#                             VITE_SYNC_URL here if the socket lives elsewhere
#   frame-src <origin>        the operator's widget page, and nothing else
#   frame-ancestors 'none'    remo itself is never framed
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://$host; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src __SUPPORT_ORIGIN__; frame-ancestors 'none'" always;
# One year, this host only. `includeSubDomains`/`preload` are the operator's decision:
# they bind every sibling subdomain of the domain to HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Room ids live in the address; they never leave for another site in a Referer.
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
