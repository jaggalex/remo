name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless: cancel it instead of
# paying for two full gates (ADR-133).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Same contract as the local dedicated test server (ADR-136): separate role,
          # separate control database, never the development credentials.
          POSTGRES_USER: remo_test
          POSTGRES_PASSWORD: remo_test
          POSTGRES_DB: remo_test_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remo_test -d remo_test_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REMO_TEST_POSTGRES_URL: postgres://remo_test:remo_test@127.0.0.1:5432/remo_test_control
      REMO_METRICS: "off"
      # Pinned so the browser cache key and the installed browser cannot disagree.
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      # Downloading Chromium is the largest fixed cost of this job after `pnpm install`.
      # The key follows the lockfile and the pinned Playwright version, so a dependency
      # bump invalidates it and a code-only change does not.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Install the same environment identity the local test server gets, then prove it.
      # The gate itself re-checks identity before any database mutation.
      - name: Test PostgreSQL identity
        run: |
          pnpm test:db:init
          pnpm test:db:check

      # Fails only on a high/critical production advisory with a fix (ADR-133). A
      # registry outage warns instead of blocking delivery; an allowlist entry needs a
      # reason and an expiry.
      - name: Dependency audit
        run: node scripts/dependency-audit.mjs

      # One gate: empty-database migration, file sizes, generated state, typecheck, all
      # tests (DB included), browser acceptance, guide audit, build, docs, design system
      # (ADR-089/090/132).
      - name: Gate
        run: |
          started=$(date +%s)
          pnpm verify --e2e
          echo "gate: $(( $(date +%s) - started ))s" >> "$GITHUB_STEP_SUMMARY"

      # A red browser run is only debuggable if its traces survive the job.
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ github.run_id }}
          path: |
            e2e-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
