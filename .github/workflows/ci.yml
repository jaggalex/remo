name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless: cancel it instead of
# paying for two full gates (ADR-133).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Same contract as the local dedicated test server (ADR-136): separate role,
          # separate control database, never the development credentials.
          POSTGRES_USER: remo_test
          POSTGRES_PASSWORD: remo_test
          POSTGRES_DB: remo_test_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U remo_test -d remo_test_control"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REMO_TEST_POSTGRES_URL: postgres://remo_test:remo_test@127.0.0.1:5432/remo_test_control
      REMO_METRICS: "off"
      # Pinned so the browser cache key and the installed browser cannot disagree.
      PLAYWRIGHT_VERSION: "1.64.1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.2.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Downloading Chromium is the largest fixed cost of this job after `pnpm install`.
      # The key follows the lockfile and the pinned Playwright version, so a dependency
      # bump invalidates it and a code-only change does not.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # Install the same environment identity the local test server gets, then prove it.
      # The gate itself re-checks identity before any database mutation.
      - name: Test PostgreSQL identity
        run: |
          pnpm test:db:init
          pnpm test:db:check

      # Report-only until the current findings are triaged: a transitive advisory must not
      # block delivery on the day the gate is added (ADR-133).
      - name: Dependency audit (report only)
        continue-on-error: true
        run: |
          echo "## Dependency audit" >> "$GITHUB_STEP_SUMMARY"
          pnpm audit --prod --audit-level high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          pnpm audit --prod --audit-level high --json > audit.json 2>/dev/null || true
          node -e '
            const fs = require("node:fs");
            let report = {};
            try { report = JSON.parse(fs.readFileSync("audit.json", "utf8")); } catch {}
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join(", ") || "no report");
          '

      # One gate: empty-database migration, file sizes, generated state, typecheck, all
      # tests (DB included), browser acceptance, guide audit, build, docs, design system
      # (ADR-089/090/132).
      - name: Gate
        run: |
          started=$(date +%s)
          pnpm verify --e2e
          echo "gate: $(( $(date +%s) - started ))s" >> "$GITHUB_STEP_SUMMARY"

      # A red browser run is only debuggable if its traces survive the job.
      - name: Upload browser evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ github.run_id }}
          path: |
            e2e-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
