# Postgres for remo (ADR-016 durable projection).
#
# Start:  docker compose up -d
# Logs:   docker compose logs -f db
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (drops the volume)
#
# The app connects over TCP on the host, so no Docker socket access is needed by
# anything outside this compose project.
services:
  db:
    image: postgres:16-alpine
    container_name: remo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remo}
      POSTGRES_DB: ${POSTGRES_DB:-remo}
      # Deterministic collation, so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - remo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remo} -d ${POSTGRES_DB:-remo}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  remo-db:
